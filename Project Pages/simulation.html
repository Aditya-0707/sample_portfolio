<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulation and Analysis - Coming Soon</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0d0d0d;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            text-align: center;
        }
        
        .title {
            font-size: 20px;
            color: #888;
            margin-bottom: 16px;
            text-transform: uppercase;
            letter-spacing: 4px;
        }

        .coming-soon {
            font-size: 80px;
            font-weight: 800;
            background: linear-gradient(90deg, #F59E0B, #EF4444, #8B5CF6);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            background-size: 200% auto;
            animation: shine 3s linear infinite;
            margin: 0;
        }

        @keyframes shine {
            to {
                background-position: 200% center;
            }
        }
        
        .back-link {
            margin-top: 60px;
            color: #888;
            text-decoration: none;
            font-size: 16px;
            border-bottom: 1px solid transparent;
            transition: all 0.3s ease;
        }
        
        .back-link:hover {
            color: #fff;
            border-bottom-color: #fff;
        }
        
        /* Grid effect for analysis feel */
        .particles {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none;
            z-index: -1;
            background-image: 
                linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            transform: perspective(500px) rotateX(60deg) scale(2);
            transform-origin: center top;
            animation: gridMove 10s linear infinite;
        }
        
        @keyframes gridMove {
            from { background-position: 0 0; }
            to { background-position: 0 40px; }
        }
    </style>
</head>
<body>
    <div class="particles"></div>
    <div class="title">Simulation and Analysis</div>
    <div class="coming-soon">COMING SOON</div>
    <div style="display: flex; gap: 24px; align-items: center; z-index: 10;">
        <a href="3d-modelling.html" class="back-link" style="margin-top: 0; padding: 12px 24px;">← Previous</a>
        <a href="../index.html" class="back-link" style="margin-top: 0; padding: 12px 24px; background: rgba(255,255,255,0.05); color: #fff;">Portfolio</a>
        <a href="rendering.html" class="back-link" style="margin-top: 0; padding: 12px 24px;">Next →</a>
    </div>
<script src="../global-cursor.js"></script>
</body>
</html>
